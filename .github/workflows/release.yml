name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/quasarea/forgejo-bridge/internal/cli.Version=${version} -X github.com/quasarea/forgejo-bridge/internal/cli.Commit=${GITHUB_SHA} -X github.com/quasarea/forgejo-bridge/internal/cli.BuildDate=${build_date}"
          mkdir -p dist staging

          build_archive() {
            os="$1"
            arch="$2"
            suffix="$3"
            name="forgejo-bridge_${version}_${os}_${arch}"
            mkdir -p "staging/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" \
              -o "staging/${name}/forgejo-bridge${suffix}" ./cmd/forgejo-bridge
            if [ "$os" = windows ]; then
              (cd staging && zip -q -r "../dist/${name}.zip" "$name")
            else
              tar -C staging -czf "dist/${name}.tar.gz" "$name"
            fi
            rm -rf "staging/${name}"
          }

          build_archive linux amd64 ""
          build_archive linux arm64 ""
          build_archive darwin amd64 ""
          build_archive darwin arm64 ""
          build_archive windows amd64 ".exe"
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
